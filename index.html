<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu | Pokemon Gen I</title>
    <link
      rel="shortcut icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQa0PKe71K2yhlqE2NLredP_Z6MmVn9HVZqgQ&s"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <!-- Pokemon Logo -->
      <div class="pokemon-logo">Pokemon</div>

      <!-- Gen Info -->
      <div class="gen-text">POKEMON GEN I</div>

      <!-- Hamburger -->
      <img src="Assignment_1/images/hamburger.png" alt="Menu" class="hamburger" />

      <!-- Pikachu-title -->
      <div class="title">Pikachu</div>

      <!-- descritption -->
      <div class="description">
        Pikachu is an Electric-type Pokemon introduced in Generation 1. Pikachu
        are small, chubby, and incredibly cute mouse-like Pokemon. They are
        almost completely covered by yellow fur.
      </div>

      <!-- counter -->
      <div class="counter">—— 01 / 08</div>

      <!-- vertical dots -->
      <div class="dots">
        <div class="dot" id="dott"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Pikachu Image -->
      <img
        src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png"
        alt=""
        class="pikachu-img"
      />

      
    <!-- Poke Ball -->
    <img src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/vector-icons-7/pokeball-xeg9gc4xzwluseur3c3mm.png/pokeball-qdt0o2i0d34nyhk4opt88.png?_a=DATAiZAAZAA0" 
         alt="" class="pokeball">
    </div>
  </body>
</html>
